name: Apply rental hero refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rental-hero-refactor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          rental = Path('components/rental-app.tsx')
          text = rental.read_text()

          old_signature = "export default function RentalApp() {"
          new_signature = "export default function RentalApp({ showHero = true }: { showHero?: boolean }) {"
          assert text.count(old_signature) == 1, 'RentalApp signature drifted'
          text = text.replace(old_signature, new_signature, 1)

          hero_start = '''      <section className="mx-auto max-w-7xl px-5 pb-12 pt-8 lg:px-8 lg:pt-12">\n        <div className="relative min-h-[520px] overflow-hidden rounded-[36px] bg-[#dfe8ef] shadow-[0_24px_80px_rgba(0,0,0,.12)]">'''
          assert text.count(hero_start) == 1, 'Rental hero start drifted'
          text = text.replace(hero_start, '''      {showHero && (\n        <section className="mx-auto max-w-7xl px-5 pb-12 pt-8 lg:px-8 lg:pt-12">\n          <div className="relative min-h-[520px] overflow-hidden rounded-[36px] bg-[#dfe8ef] shadow-[0_24px_80px_rgba(0,0,0,.12)]">''', 1)

          hero_end = '''        </div>\n      </section>\n\n      <section id="browse"'''
          assert text.count(hero_end) == 1, 'Rental hero end drifted'
          text = text.replace(hero_end, '''          </div>\n        </section>\n      )}\n\n      <section id="browse"''', 1)
          rental.write_text(text)

          page = Path('app/page.tsx')
          page.write_text('''import DriftPhase2Home from '@/components/drift-phase2-home';\nimport RentalApp from '@/components/rental-app';\n\nexport default function Home() {\n  return (\n    <>\n      <DriftPhase2Home />\n      <div className="drift-rental-shell bg-[#f5f5f7]">\n        <RentalApp showHero={false} />\n      </div>\n    </>\n  );\n}\n''')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-rental-hero-refactor.yml
          git config user.name "ashleyscomputer"
          git config user.email "ashleyvrfx@gmail.com"
          git add components/rental-app.tsx app/page.tsx
          git diff --cached --check
          git commit -m "Clean rental hero composition API"
          git push origin HEAD:main
