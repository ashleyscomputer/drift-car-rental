name: Drift quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Phase 2 cinematic lint
        id: phase2lint
        continue-on-error: true
        run: npx oxlint components/drift-cinematic-home.tsx

      - name: Repository lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Report lint status
        if: steps.phase2lint.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: |
          echo "Build passed. Lint findings remain and are reported above."
          echo "Phase 2 lint outcome: ${{ steps.phase2lint.outcome }}"
          echo "Repository lint outcome: ${{ steps.lint.outcome }}"
