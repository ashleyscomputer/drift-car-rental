name: Drift quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cinematic lint
        id: cinematiclint
        run: npx oxlint components/drift-phase2-home.tsx

      - name: Repository lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Report baseline lint debt
        if: steps.lint.outcome == 'failure'
        run: echo "Cinematic lint and build passed; repository-wide pre-existing lint debt remains."
